name: Prueba de agentes

on:
  workflow_dispatch:
    inputs:
      design_urls:
        description: "URLs de fotos de bordados separadas por coma. Vacío = usa las fotos de samples/"
        required: false
        default: ""
      batch:
        description: "Usar batch de Gemini (mitad de precio, puede tardar horas)"
        type: boolean
        default: false
      recolor:
        description: "Experimento: teñir por código las fotos a los otros colores y mostrarlas al lado"
        type: boolean
        default: false
      quality:
        description: "Calidad: economica, baja, media o alta"
        required: false
        default: "economica"

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Correr la prueba
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DESIGN_URLS: ${{ inputs.design_urls }}
          IMAGE_USE_BATCH: ${{ inputs.batch }}
          IMAGE_QUALITY: ${{ inputs.quality }}
          RECOLOR: ${{ inputs.recolor && '--recolor' || '' }}
        run: |
          if [ -n "$DESIGN_URLS" ]; then
            npm run trial -- $RECOLOR "$DESIGN_URLS"
          else
            shopt -s nullglob nocaseglob
            files=(samples/*.jpg samples/*.jpeg samples/*.png samples/*.webp)
            if [ ${#files[@]} -eq 0 ]; then echo "No hay URLs ni fotos en samples/"; exit 1; fi
            npm run trial -- $RECOLOR "${files[@]}"
          fi
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-prueba
          path: runs/
          if-no-files-found: ignore
          retention-days: 14
